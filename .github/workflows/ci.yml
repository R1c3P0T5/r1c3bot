name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

# Actions are pinned to a commit SHA with the version in a trailing comment,
# the form astral-sh/setup-uv documents. A tag is a mutable ref and can be
# repointed, so pinning one does not fix which code runs; a SHA does.
# astral-sh/setup-uv also publishes no floating major tag past v7, so @v10 does
# not resolve at all.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
      - run: uv sync --locked
      - run: uv lock --check
      - run: uv run pre-commit run --all-files

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run pytest

  build:
    runs-on: ubuntu-latest
    steps:
      # uv-dynamic-versioning derives the version from git tags, so the full
      # history is required; a shallow fetch silently yields 0.0.0.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - run: uv build
      - name: Import the built wheel in an isolated environment
        run: |
          wheel=$(ls dist/*.whl)
          uv run --isolated --no-project --with "$wheel" python -c "import ricebot"

  commit-messages:
    runs-on: ubuntu-latest
    steps:
      # A pull request is checked over its own commits only, so a failure
      # points at the contributor's work rather than at older history.
      # A push to main re-checks every message in the repository.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Validate commit messages
        env:
          # Empty on a push event, which selects the whole-history branch.
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "$BASE" ]; then
            scripts/check_commit_msgs.sh "$BASE..HEAD"
          else
            scripts/check_commit_msgs.sh HEAD
          fi
