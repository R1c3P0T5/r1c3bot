default_install_hook_types: [pre-commit, commit-msg, pre-push]
default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: detect-private-key
      - id: mixed-line-ending

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.4
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/rvben/rumdl-pre-commit
    rev: v0.2.79
    hooks:
      - id: rumdl-fmt
      - id: rumdl-check

  - repo: local
    hooks:
      - id: check-commit-msg
        name: check commit message
        entry: uv run --no-project scripts/check_commit_msg.py
        language: system
        stages: [commit-msg]

      - id: check-pushed-commit-msgs
        name: check the commit messages being pushed
        entry: scripts/check_commit_msgs.sh
        language: script
        pass_filenames: false
        stages: [pre-push]

      - id: check-lockfile
        name: check the lockfile is in sync
        entry: uv lock --check
        language: system
        pass_filenames: false
        stages: [pre-push]
